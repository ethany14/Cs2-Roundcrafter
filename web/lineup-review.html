<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>道具瞄点素材核验</title><link rel="stylesheet" href="/tactics.css"><style>body{max-width:1500px}.layout{display:grid;grid-template-columns:300px 1fr;gap:20px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.thumb{width:100%;display:block;cursor:zoom-in}.tile{background:#172632;border-radius:8px;padding:10px}.tile p{margin:4px 0;font-size:12px}.tile button{padding:4px 8px;margin:3px;font-size:13px}#large{width:100%;max-height:70vh;object-fit:contain;background:#080e12}aside{position:sticky;top:15px;align-self:start}#items{width:100%}#choices{white-space:pre-wrap}a,button{margin-bottom:8px}.badge{color:#efce89}dialog{width:95vw;max-width:1500px;background:#13202a;color:white;border:1px solid #547;max-height:95vh}dialog img{width:100%;object-fit:contain;max-height:80vh}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{position:static}}</style></head><body><header><a href="/">← 资料库</a><h1>先看清瞄点，再学习怎么投</h1><p>保留完整画面，区分站位、瞄准和出手。清晰度或画面稳定不能证明它是正确瞄点。</p><p id="summary"></p></header><div class="layout"><aside class="card"><select id="items"></select><h2 id="title"></h2><p id="method"></p><p id="state"></p><a id="source" target="_blank" rel="noopener">资料来源</a><a id="video" target="_blank" rel="noopener">原始教学视频</a><p class="note">本站素材仅用于本地核验；来源仍属于第三方，未确认公开分发授权。</p><p class="badge">分类结果只保存在本机浏览器，尚未发布给玩家。</p><pre id="choices"></pre><button id="export">导出核验记录</button><a href="/nuke">查看战术效果与执行检查 →</a></aside><main><section class="model"><h2>原站分步图</h2><p>图片顺序来自页面加载顺序，需核验后排列。点击图片查看原尺寸；不自动把画面中心当准星。</p><p id="imageNote"></p><div id="images" class="gallery"></div></section><section class="model"><h2>本地视频候选帧</h2><p id="frameNote">待视频抽帧。帧序号保留时间信息，站投与跑投分别核验。</p><div id="frames" class="gallery"></div></section><p id="error" role="alert"></p></main></div><dialog id="dialog"><button id="close">关闭</button><img id="large" alt="完整原始画面"><p id="largeLabel"></p></dialog><script type="module" src="/lineup-review.js"></script></body></html>
