<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>战术约束道具求解</title><link rel="stylesheet" href="/tactics.css"><style>.layout{display:grid;grid-template-columns:340px 1fr;gap:20px}#viewport{height:500px;background:#111d28}pre{white-space:pre-wrap;overflow-wrap:anywhere}#command{width:100%;min-height:95px}li{margin:10px 0}.notice{color:#edc879}@media(max-width:800px){.layout{grid-template-columns:1fr}}</style></head><body><header><a href="/">← 战术库</a><h1>从战术需求寻找投法</h1><p>GL A 假打转 Ramp · Nuke · 屋顶支援 → Heaven 烟</p><p id="summary"></p></header><div class="layout"><aside class="card"><h2>战术约束</h2><p id="intent"></p><ul id="steps"></ul><a id="source" target="_blank" rel="noopener">查看来源</a><p class="notice">先做站立左键投掷。候选未经游戏内校准，不能视为已验证道具。</p><h3>时序检查</h3><label>当前回合剩余秒数 <input id="clock" type="number" min="0" max="115" value="110"></label><label>到站位耗时（未知可留空）<input id="travel" type="number" min="0" placeholder="待实测"></label><button id="check">检查当前候选</button><pre id="timing"></pre></aside><main><section class="card"><h2>模拟轨迹</h2><p>黄色：计算轨迹 · 绿色：投掷站位 · 蓝色：目标区域中心 · 红色：假设敌方可能观察的枪线（非实际敌人位置）</p><div id="viewport"></div><select id="candidate" aria-label="候选投法"></select><p id="detail"></p><p id="corridor"></p><p id="unknown" class="notice"></p></section><section class="card"><h2>练习服定位</h2><p>站立、静止、左键普通投掷；定位指令只设置站位和视角。请在本地练习服开启相应权限。</p><textarea id="command" readonly aria-label="练习定位指令"></textarea><button id="copy">复制实验指令</button><span id="copied"></span></section><section class="card"><h2>本轮搜索范围与限制</h2><pre id="limits"></pre></section><p id="error" role="alert"></p></main></div><script type="module" src="/tactical-solver.js"></script></body></html>
